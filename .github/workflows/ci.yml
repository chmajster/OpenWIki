name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, openssl, dom, curl, phar, ldap, zip, gd
          coverage: none

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build editor and install browser test dependencies
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: npm run check:js

      - name: Bash installer syntax
        run: |
          bash -n install.sh
          bash -n scripts/build-editor.sh
          bash -n scripts/local-server.sh
          bash -n scripts/upgrade.sh
          bash -n tests/Upgrade/driver.sh

      - name: Bash installer help
        run: NO_COLOR=1 bash install.sh --help

      - name: Unit and integration tests
        env:
          OPENWIKI_TEST_DB_HOST: 127.0.0.1
          OPENWIKI_TEST_DB_PORT: 3306
          OPENWIKI_TEST_DB_DATABASE: openwiki_test
          OPENWIKI_TEST_DB_USERNAME: root
          OPENWIKI_TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit

      - name: Real editor browser tests
        env:
          OPENWIKI_TEST_DB_HOST: 127.0.0.1
          OPENWIKI_TEST_DB_PORT: 3306
          OPENWIKI_TEST_DB_DATABASE: openwiki_test
          OPENWIKI_TEST_DB_USERNAME: root
          OPENWIKI_TEST_DB_PASSWORD: root
        run: npm run test:browser

      - name: Reproducible 10000-page search benchmark
        env:
          OPENWIKI_TEST_DB_HOST: 127.0.0.1
          OPENWIKI_TEST_DB_PORT: 3306
          OPENWIKI_TEST_DB_DATABASE: openwiki_search_benchmark_test
          OPENWIKI_TEST_DB_USERNAME: root
          OPENWIKI_TEST_DB_PASSWORD: root
          APP_KEY: benchmark-test-key-benchmark-test-key
        run: |
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE openwiki_search_benchmark_test CHARACTER SET utf8mb4'
          git fetch origin 97a833147bb003d8b92ff95cb5675c78ce690ab5
          mkdir -p storage/temp/search-baseline
          git archive 97a833147bb003d8b92ff95cb5675c78ce690ab5 | tar -x -C storage/temp/search-baseline
          php tests/Search/benchmark.php --seed
          php tests/Search/benchmark.php --baseline > storage/temp/search-before.json
          php tests/Search/benchmark.php > storage/temp/search-after.json
          python3 tests/Search/report.py storage/temp/search-before.json storage/temp/search-after.json > storage/temp/search-report.md
          cat storage/temp/search-report.md

      - name: Search benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: search-benchmark
          path: |
            storage/temp/search-before.json
            storage/temp/search-after.json
            storage/temp/search-report.md

      - name: Non-root local runtime end-to-end
        env:
          OPENWIKI_TEST_DB_HOST: 127.0.0.1
          OPENWIKI_TEST_DB_PORT: 3306
          OPENWIKI_TEST_DB_DATABASE: openwiki_test
          OPENWIKI_TEST_DB_USERNAME: root
          OPENWIKI_TEST_DB_PASSWORD: root
        run: python3 tests/Local/runtime.py

      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 3

      - name: Editor screenshots and measured performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-verification
          path: |
            storage/temp/editor-*.png
            storage/temp/document-*.png
            storage/temp/daily-editor-*.png
            storage/temp/space-*.png
            storage/temp/editor-performance.json
          retention-days: 7

      - name: Verify PHP release package without Node.js runtime
        shell: bash
        run: |
          composer install --no-dev --prefer-dist --no-interaction
          node scripts/package-release.cjs "$RUNNER_TEMP/openwiki.tar.gz"
          mkdir "$RUNNER_TEMP/openwiki-runtime"
          tar -xzf "$RUNNER_TEMP/openwiki.tar.gz" -C "$RUNNER_TEMP/openwiki-runtime"
          for asset in wiki-editor.js diagram.js document-reader.js diagram.html; do test -s "$RUNNER_TEMP/openwiki-runtime/public/assets/$asset"; done
          test ! -d "$RUNNER_TEMP/openwiki-runtime/node_modules"
          test ! -f "$RUNNER_TEMP/openwiki-runtime/.env"
          cd "$RUNNER_TEMP/openwiki-runtime"
          php scripts/local-runtime.php php-ready
          php scripts/local-runtime.php assets-ready
          php -r 'require "bootstrap/autoload.php"; $c = new OpenWiki\Wiki\ContentService(); if ($c->normalize("markdown", "", "# Release")["html"] !== "<h1>Release</h1>") exit(1);'


  upgrade-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: ["mysql:8.0", "mariadb:11.4"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      OPENWIKI_TEST_DB_HOST: 127.0.0.1
      OPENWIKI_TEST_DB_PORT: 3306
      OPENWIKI_TEST_DB_DATABASE: openwiki_test
      OPENWIKI_TEST_DB_USERNAME: root
      OPENWIKI_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, openssl, dom, curl, phar, ldap, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Prepare actual runtime dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
      - name: Migration DDL and private recovery tests
        run: vendor/bin/phpunit --filter 'MigrationRecoveryTest|EditorDraftMigrationTest|RecoverySnapshotTest'
      - name: Upgrade old schema with accounts, revisions, drafts and attachments
        run: python3 tests/Upgrade/runtime.py

  docker-runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Docker and runtime shell syntax
        run: |
          docker version
          docker compose version
          bash -n install.sh scripts/local-server.sh scripts/docker-runtime.sh
          sh -n docker/php/entrypoint.sh docker/php/worker.sh
      - name: Isolated Docker wizard, RW code, persistent data and lifecycle
        run: python3 tests/Docker/runtime.py --workspace-temp
      - name: Runtime failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-diagnostics
          path: storage/temp/docker-runtime-last.log
          if-no-files-found: ignore

  installer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned build toolchain for hosts with older Node.js
        run: bash scripts/build-editor.sh --pinned-node

      - name: Fresh host install
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci OPENWIKI_GIT_REF="$ref" NO_COLOR=1 \
            bash ./install.sh <<'EOF'
          openwiki_ci
          openwiki_ci
          OpenWiki-DB-CI-Password-123!
          OpenWiki CI
          http://127.0.0.1
          UTC
          ci-admin
          ci@example.invalid
          OpenWiki-Admin-CI-Password-123!
          CI
          Admin
          EOF

      - name: Verify installed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1/health >/dev/null
          test "$(sudo stat -c '%a' /var/www/openwiki-ci/.env)" = "640"
          test "$(sudo stat -c '%a' /var/www/openwiki-ci/install.sh)" = "755"
          for asset in wiki-editor.js diagram.js document-reader.js diagram.html; do test -s "/var/www/openwiki-ci/public/assets/$asset"; done
          curl --fail --silent --show-error http://127.0.0.1/assets/wiki-editor.js >/dev/null
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --status

      - name: Verify repair idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          before="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci OPENWIKI_GIT_REF="$ref" NO_COLOR=1 \
            bash ./install.sh --repair </dev/null
          after="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          test "$before" = "$after"
          curl --fail --silent --show-error http://127.0.0.1/health >/dev/null

      - name: Verify existing install refusal and managed upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          before="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          if sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --install </dev/null; then exit 1; fi
          # Exercise an actual socket alias, independently of distro defaults.
          socket="$(sudo awk '/fastcgi_pass unix:/{sub(/.*unix:/, ""); sub(/;.*/, ""); print; exit}' /etc/nginx/sites-available/openwiki)"
          sudo ln -sfn "$socket" /run/php/openwiki-ci-alias.sock
          sudo sed -i 's|fastcgi_pass unix:.*;|fastcgi_pass unix:/run/php/openwiki-ci-alias.sock;|' /etc/nginx/sites-available/openwiki
          sudo nginx -t
          sudo systemctl reload nginx
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --upgrade "$ref" </dev/null
          sudo grep -q 'fastcgi_pass unix:/run/php/openwiki-ci-alias.sock;' /etc/nginx/sites-available/openwiki
          after="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          test "$before" = "$after"
          test -L /var/www/openwiki-ci/current
          curl --fail --silent --show-error http://127.0.0.1/health >/dev/null
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --upgrade "$ref" </dev/null
          recovery="$(sudo php -r '$v=json_decode(file_get_contents($argv[1]), true); echo $v["id"].":".$v["backup_sha256"];' /var/www/openwiki-ci/.openwiki/status.json)"
          socket="$(readlink -f /run/php/openwiki-ci-alias.sock)"
          service="$(sudo grep -l "^[[:space:]]*listen[[:space:]]*=[[:space:]]*$socket[[:space:]]*$" /etc/php/*/fpm/pool.d/*.conf | head -n1 | cut -d/ -f4)"
          test -n "$service"
          sudo systemctl stop "php$service-fpm.service"
          if sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --upgrade "$ref" </dev/null; then exit 1; fi
          sudo systemctl start "php$service-fpm.service"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --resume </dev/null
          after_recovery="$(sudo php -r '$v=json_decode(file_get_contents($argv[1]), true); echo $v["id"].":".$v["backup_sha256"];' /var/www/openwiki-ci/.openwiki/status.json)"
          test "$recovery" = "$after_recovery"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --repair </dev/null
          sudo touch /var/www/openwiki-ci/.openwiki/maintenance
          curl --fail --silent --show-error http://127.0.0.1/health/live >/dev/null
          test "$(curl --silent --output "$RUNNER_TEMP/maintenance.json" --write-out '%{http_code}' http://127.0.0.1/health)" = 503
          php -r '$v=json_decode(file_get_contents($argv[1]), true); if (($v["status"] ?? null) !== "maintenance" || ($v["checks"]["database"] ?? null) !== true) exit(1);' "$RUNNER_TEMP/maintenance.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/login)" = 503
          sudo rm /var/www/openwiki-ci/.openwiki/maintenance

      - name: Uninstall
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'DELETE\n' |
            sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --uninstall
          test ! -e /var/www/openwiki-ci

      - name: Install an actual legacy release with schema 004
        shell: bash
        run: |
          set -Eeuo pipefail
          legacy=08425a0029bc60e3cab69bf0206f1276f0a24cf6
          sudo mkdir /var/www/openwiki-legacy-ci
          sudo git -C /var/www/openwiki-legacy-ci init
          sudo git -C /var/www/openwiki-legacy-ci remote add origin https://github.com/chmajster/OpenWIki.git
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-legacy-ci OPENWIKI_GIT_REF="$legacy" NO_COLOR=1 \
            bash ./install.sh <<'EOF'
          openwiki_legacy_ci
          openwiki_legacy_ci
          OpenWiki-DB-CI-Password-123!
          OpenWiki Legacy CI
          http://127.0.0.1
          UTC
          ci-admin
          ci@example.invalid
          OpenWiki-Admin-CI-Password-123!
          CI
          Admin
          EOF
          sudo php tests/Upgrade/host-fixture.php seed /var/www/openwiki-legacy-ci > "$RUNNER_TEMP/upgrade-host.json"
          sudo php tests/Upgrade/host-fixture.php snapshot /var/www/openwiki-legacy-ci > "$RUNNER_TEMP/upgrade-data-before"
          sudo sha256sum /var/www/openwiki-legacy-ci/.env | awk '{print $1}' > "$RUNNER_TEMP/upgrade-key-before"

      - name: Upgrade actual legacy PHP-FPM runtime and verify preserved data
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-legacy-ci NO_COLOR=1 bash ./install.sh --upgrade "$ref" </dev/null
          sudo php tests/Upgrade/host-fixture.php snapshot /var/www/openwiki-legacy-ci > "$RUNNER_TEMP/upgrade-data-after"
          sudo sha256sum /var/www/openwiki-legacy-ci/.env | awk '{print $1}' > "$RUNNER_TEMP/upgrade-key-after"
          cmp "$RUNNER_TEMP/upgrade-data-before" "$RUNNER_TEMP/upgrade-data-after"
          cmp "$RUNNER_TEMP/upgrade-key-before" "$RUNNER_TEMP/upgrade-key-after"
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('upgrade', 'tests/Upgrade/runtime.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          seeded = json.loads((Path(os.environ['RUNNER_TEMP']) / 'upgrade-host.json').read_text())
          module.verify_http(Path('/var/www/openwiki-legacy-ci/current'), seeded, remote_url='http://127.0.0.1')
          print('Actual Nginx/PHP-FPM login, page form, API and protected attachment verified.')
          PY
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-legacy-ci NO_COLOR=1 bash ./install.sh --upgrade-status
          printf 'DELETE\n' | sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-legacy-ci NO_COLOR=1 bash ./install.sh --uninstall
