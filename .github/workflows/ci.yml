name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openwiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, openssl, dom, curl, phar, ldap, zip, gd
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: node --check public/assets/app.js

      - name: Bash installer syntax
        run: bash -n install.sh

      - name: Bash installer help
        run: NO_COLOR=1 bash install.sh --help

      - name: Unit and integration tests
        env:
          OPENWIKI_TEST_DB_HOST: 127.0.0.1
          OPENWIKI_TEST_DB_PORT: 3306
          OPENWIKI_TEST_DB_DATABASE: openwiki_test
          OPENWIKI_TEST_DB_USERNAME: root
          OPENWIKI_TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit


  installer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh host install
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci OPENWIKI_GIT_REF="$ref" NO_COLOR=1 \
            bash ./install.sh <<'EOF'
          openwiki_ci
          openwiki_ci
          OpenWiki-DB-CI-Password-123!
          OpenWiki CI
          http://127.0.0.1
          UTC
          ci-admin
          ci@example.invalid
          OpenWiki-Admin-CI-Password-123!
          CI
          Admin
          EOF

      - name: Verify installed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1/health >/dev/null
          test "$(sudo stat -c '%a' /var/www/openwiki-ci/.env)" = "640"
          test "$(sudo stat -c '%a' /var/www/openwiki-ci/install.sh)" = "755"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --status

      - name: Verify repair idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          before="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci OPENWIKI_GIT_REF="$ref" NO_COLOR=1 \
            bash ./install.sh </dev/null
          after="$(sudo sha256sum /var/www/openwiki-ci/.env | awk '{print $1}')"
          test "$before" = "$after"
          curl --fail --silent --show-error http://127.0.0.1/health >/dev/null

      - name: Uninstall
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'DELETE\n' |
            sudo env OPENWIKI_INSTALL_DIR=/var/www/openwiki-ci NO_COLOR=1 bash ./install.sh --uninstall
          test ! -e /var/www/openwiki-ci
