name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, dom, curl, phar, ldap, zip, gd
          coverage: none
      - run: |
          npm ci
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          node scripts/package-release.cjs /tmp/openwiki.tar.gz
          node scripts/package-release.cjs /tmp/openwiki.zip
      - name: Publish PHP runtime with compiled static assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" /tmp/openwiki.tar.gz /tmp/openwiki.zip /tmp/openwiki.tar.gz.sha256 /tmp/openwiki.zip.sha256 --generate-notes
